<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETERCOP - Tienda de Limpieza</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script defer src="./js/main.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <header>
        <nav class="navbar navbar-expand-lg nav-mio">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="./assets/logo detercop.png" alt="Logo Detercop" class="nav-img">
                </a>
            </div>
        </nav>
        
        <h1>Tienda DETERCOP</h1>
        <div id="mensaje-notificacion" class="oculto"></div>
    </header>

    <main>
        <section id="tienda">
            
            <div id="carruselDetercop" class="carousel slide mb-4" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="./assets/escobas_proyecto.png" class="d-block w-100 img-carrusel" alt="Escobas Detercop">
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/guantes_proyecto.png" class="d-block w-100 img-carrusel" alt="Guantes de goma">
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/microfibras_proyecto.png" class="d-block w-100 img-carrusel" alt="Paños de microfibra">
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/regaderas_proyecto.png" class="d-block w-100 img-carrusel" alt="Regaderas">
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/rejillas_proyecto.png" class="d-block w-100 img-carrusel" alt="Rejillas y esponjas">
                    </div>
                </div>
                
                <button class="carousel-control-prev" type="button" data-bs-target="#carruselDetercop" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carruselDetercop" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
            <h2>Nuestros Productos</h2>
            <div id="contenedor-productos"></div>
        </section>

        <aside id="carrito">
            <h2>Tu Carrito</h2>
            <div id="contenedor-carrito">
                <p>El carrito está vacío.</p>
            </div>
            <div id="carrito-total">
                <p>Total: $0</p>
            </div>
            <button id="btn-vaciar" class="btn-secundario">Vaciar Carrito</button>
            <button id="btn-finalizar" class="btn-comprar">Finalizar Compra</button>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
